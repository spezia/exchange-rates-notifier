<html>
  <body style="font-family: Arial, sans-serif; background-color: #ffffff; padding: 20px;">
    <h1 style="color: #615e59; text-align: center; margin-bottom: 50px;">Today's Exchange Rates [ {{ date }} ]</h1>
    <table style="border-collapse: collapse; width: 60%; margin: 0 auto;">
      <!-- Header -->
      <tr style="background-color: #dba204; color: white; text-align: center; font-size: 16px;">
        <th style="width: 50%; padding: 12px; border: 1px solid #ebebeb;">Currency</th>
        <th style="width: 50%; padding: 12px; border: 1px solid #ebebeb;">Rate</th>
      </tr>

      <!-- Rows will be inserted here -->
      {{ rows }}

    </table>
  </body>
</html>
